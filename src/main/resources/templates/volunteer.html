
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer | PawRescue</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <header>
        <div class="logo">🐾 PawRescue</div>
        <nav>
            <a href="/">Home</a>
            <a href="/report">Report Animal</a>
            <a href="/volunteer">Volunteer</a>
        </nav>
    </header>

    <section class="main-content">
        <div class="about">
            <h2>❤️ Become a Volunteer</h2>
            <p>Join our team and help street animals in need.</p>

            <form action="/volunteer" method="post">
                <p>Your Name</p>
                <input type="text" name="name"
                       placeholder="Enter your name" required>

                <p>Email</p>
                <input type="email" name="email"
                       placeholder="Enter your email" required>

                <p>Phone Number</p>
                <input type="tel" name="phone"
                       placeholder="Enter your phone number" required>

                <p>Your Location</p>
                <input type="text" name="location"
                       placeholder="Enter your location" required>

                <br><br>
                <button type="submit" class="btn">Join as Volunteer</button>
            </form>
        </div>
    </section>

    <footer>
        <p>© 2026 PawRescue | Care for Every Paw ❤️</p>
    </footer>

</body>
</html>
